name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - learn-CI-CD
  pull_request:
    branches:
      - learn-CI-CD

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci-cd/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ci-cd

      - name: Run lint
        run: npm run lint
        working-directory: ci-cd

      - name: Build application
        run: npm run build
        working-directory: ci-cd

 cd:
  name: Continuous Deployment
  runs-on: ubuntu-latest
  needs: ci
  if: github.ref == 'refs/heads/learn-CI-CD'

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci
      working-directory: ci-cd

    - name: Build Next.js app
      run: npm run build
      working-directory: ci-cd

    - name: Export static files
      run: npm run export
      working-directory: ci-cd

    - name: Setup SSH
      run: |
        echo "${{ secrets.SSH_KEY }}" > key.pem
        chmod 600 key.pem

    - name: Deploy to EC2
      run: |
        scp -r -o StrictHostKeyChecking=no -i key.pem ci-cd/out/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/
        ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo rm -rf /usr/share/nginx/html/* && sudo mv /tmp/* /usr/share/nginx/html/"
